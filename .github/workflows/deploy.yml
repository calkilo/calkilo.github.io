name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build

      - name: Audit exported SEO output
        run: npm run seo:audit

      - name: Audit food nutrition and crawlability
        run: npm run seo:food-audit

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Verify static export output
        run: |
          test -d out
          test -f out/index.html
          test -f out/404.html
          test -f out/CNAME
          grep -qx 'calkilo.com' out/CNAME
          test -f out/.nojekyll
          test -d out/_next
          test -f out/contact/index.html
          test -f out/faq/index.html
          test -f out/uber-eats-nutrition-calculator/index.html
          test -f out/llms.txt
          test -f out/e61d4bd78a471d760d7acf510125a6c0.txt
          test ! -e 'out/[lang]'
          test ! -e out/contact.html
          test ! -e out/faq.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Upload discovery data for post-deploy submission
        uses: actions/upload-artifact@v4
        with:
          name: discovery-data
          path: |
            public/sitemap.xml
            public/blog-sitemap.xml
            public/food-sitemap.xml
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout IndexNow submission script
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download generated discovery data
        uses: actions/download-artifact@v4
        with:
          name: discovery-data
          path: public

      - name: Notify IndexNow after deployment
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
