name: Deploy to Calkilo server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "production-server"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test search and redirect validation
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build Next.js site
        run: npm run build

      - name: Audit exported SEO output
        run: npm run seo:audit

      - name: Audit food nutrition and crawlability
        run: npm run seo:food-audit

      - name: Verify static export output
        run: |
          test -d out
          test -f out/index.html
          test -f out/404.html
          test -d out/_next
          test -f out/contact/index.html
          test -f out/faq/index.html
          test -f out/uber-eats-nutrition-calculator/index.html
          test -f out/llms.txt
          test -f out/e61d4bd78a471d760d7acf510125a6c0.txt
          test ! -e 'out/[lang]'
          test ! -e out/contact.html
          test ! -e out/faq.html

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: ./out
          retention-days: 3

      - name: Upload discovery data for post-deploy submission
        uses: actions/upload-artifact@v4
        with:
          name: discovery-data
          path: |
            public/sitemap.xml
            public/blog-sitemap.xml
            public/food-sitemap.xml
          retention-days: 1

  deploy:
    environment:
      name: production
      url: https://calkilo.com
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: calkilo-web
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Download static site
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: out

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          EOF

      - name: Upload and activate release
        run: |
          set -euo pipefail
          ssh production "mkdir -p /var/www/calkilo-landing/incoming/$RELEASE_ID"
          rsync -az --delete --chmod=D755,F644 out/ "production:/var/www/calkilo-landing/incoming/$RELEASE_ID/"
          ssh production "bash -s -- $RELEASE_ID" < deploy/activate-release.sh

      - name: Remove deployment credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts ~/.ssh/config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download generated discovery data
        uses: actions/download-artifact@v4
        with:
          name: discovery-data
          path: public

      - name: Notify IndexNow after deployment
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
