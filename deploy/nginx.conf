# Install as /etc/nginx/sites-available/calkilo-landing and enable it.
# After DNS points here, use certbot --nginx --no-redirect -d calkilo.com -d www.calkilo.com
# to add HTTPS. Keep HTTP available for local deployment health checks.
server {
    listen 80;
    listen [::]:80;
    server_name calkilo.com www.calkilo.com;
    root /var/www/calkilo-landing/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /_next/static/ {
        alias /var/www/calkilo-landing/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~ /\. {
        deny all;
    }
}
