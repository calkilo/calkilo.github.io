# Install after certificates exist; redirect data is generated by reload-site.py.
map_hash_bucket_size 256;
map $uri $calkilo_redirect {
    default "";
    include /etc/nginx/snippets/calkilo-redirects.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name calkilo.com www.calkilo.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://calkilo.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.calkilo.com;
    ssl_certificate /etc/letsencrypt/live/calkilo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calkilo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://calkilo.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name calkilo.com;
    ssl_certificate /etc/letsencrypt/live/calkilo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calkilo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/calkilo-landing/current;
    index index.html;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    if ($calkilo_redirect != "") { return 301 https://calkilo.com$calkilo_redirect$is_args$args; }
    # Use the original request to avoid redirecting Nginx's internal index lookup.
    if ($request_uri ~ "^([^?]*)/index\.html(\?.*)?$") { return 301 https://calkilo.com$1/$2; }

    location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
    location /_next/static/ {
        alias /var/www/calkilo-landing/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/versioned/ {
        alias /var/www/calkilo-landing/versioned-assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /data/versioned/ {
        alias /var/www/calkilo-landing/versioned-data/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=86400, must-revalidate"; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
}

# Health checks stay private and unaffected by public canonical redirects.
server {
    listen 127.0.0.1:8089;
    server_name localhost;
    root /var/www/calkilo-landing/current;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
